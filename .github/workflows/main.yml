# 工作流的名称
name: Build Bujuan for Windows

# 触发工作流的事件
on:
  # 1. 当有代码推送到 main 分支时自动触发
  push:
    branches: [ main ]
  # 2. 允许你手动在 Actions 页面点击按钮来触发
  workflow_dispatch:

# 定义工作流中要执行的任务
jobs:
  build:
    # 指定运行此任务的虚拟机环境，我们用最新的 Windows 服务器
    runs-on: windows-latest

    # 定义任务的步骤
    steps:
      # 第一步：检出（下载）你的仓库代码到虚拟机
      # 重点：增加了 submodules: 'recursive' 来确保子模块也被下载
      - name: Checkout code
        uses: actions/checkout@v4 # 同时将 checkout 更新到 v4
        with:
          submodules: 'recursive' # <<< THIS IS THE FIX

      # 第二步：设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 第三步：获取项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 第四步：编译 Windows release 版本
      - name: Build Windows executable
        run: flutter build windows

      # 第五步：上传编译好的文件作为 "Artifact"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-windows-build
          path: build/windows/runner/Release
