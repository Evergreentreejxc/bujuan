# 工作流的名称
name: Build Bujuan for Windows

# 触发工作流的事件
on:
  # 1. 当有代码推送到 main 分支时自动触发
  push:
    branches: [ main ]
  # 2. 允许你手动在 Actions 页面点击按钮来触发
  workflow_dispatch:

# 定义工作流中要执行的任务
jobs:
  build:
    # 指定运行此任务的虚拟机环境，我们用最新的 Windows 服务器
    runs-on: windows-latest

    # 定义任务的步骤
    steps:
      # 第一步：检出（下载）你的仓库代码到虚拟机
      - name: Checkout code
        uses: actions/checkout@v3

      # 第二步：设置 Flutter 环境
      # 使用一个社区维护的 action 来快速安装 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 使用稳定版的 Flutter

      # 第三步：获取项目依赖
      - name: Get dependencies
        run: flutter pub get

      # 第四步：编译 Windows release 版本
      - name: Build Windows executable
        run: flutter build windows

      # 第五步：上传编译好的文件作为 "Artifact"
      # "Artifact" 是指工作流产生的文件，可以供你下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 上传后显示的文件名
          name: bujuan-windows-build
          # 要上传的文件所在的路径
          path: build/windows/runner/Release
